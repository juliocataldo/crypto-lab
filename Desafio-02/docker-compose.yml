version: '3.8'

services:
  cripto-lab:
    build: .
    container_name: cripto-lab
    ports:
      - "8080:80"
    volumes:
      - ./challenges:/var/www/html/challenges:ro
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - cripto-network
    restart: unless-stopped

networks:
  cripto-network:
    driver: bridge
